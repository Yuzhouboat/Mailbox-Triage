# Settings for start-claude.sh in this project. Edit freely.
#
# The tmux session name and the Remote Control session name are
# DIFFERENT strings, deliberately:
#   - tmux session name = this project's full path with "/"
#     replaced by "-" ("home-yuzhou-Projects-Mailbox-Triage-<timestamp>" right now) —
#     always unique, fixed in start-claude.sh, not configurable
#     here or below.
#   - Remote Control session name = claude --remote-control
#     --remote-control-session-name-prefix
#     "$HOST-$SESSION-<timestamp>" (fixed hostname prefix,
#     SESSION below is the human-friendly part you can edit).

# SESSION controls only the Remote Control session name — NOT the
# tmux session name (that's the path-based name above, and can't
# be changed). Full Remote Control base = "<hostname>-<SESSION>".
# - Set here: used exactly as written (after the hostname prefix).
# - Commented out / removed: auto-derived as
#   "<project-folder-name>", which keeps tracking the folder
#   name if it's renamed later.
SESSION="email-triage"

# Text typed into the claude session once it boots.
PROMPT="/mailbox-triage please triage my exchange and gmail mailbox for the last 7 days"

# Seconds to wait after launching claude before typing PROMPT.
# Raise this if the TUI is slow to boot and the prompt gets eaten.
BOOT_WAIT=5

# Minutes of no pane output before an existing "home-yuzhou-Projects-Mailbox-Triage-<timestamp>" tmux session is
# treated as idle and killed. start-claude.sh always starts a new
# timestamped session on every run regardless of this value — it only
# controls cleanup of old ones. A session still actively producing
# output (even a slow task) is left running untouched, no matter
# how long it's been up.
IDLE_MINUTES=30

# Cron schedule (crontab syntax) for this script. setup.sh reads this
# as its default and keeps it in sync with whatever it installs.
CRON_SCHEDULE="1 * * * *"
